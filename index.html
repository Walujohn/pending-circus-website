<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pending Circus</title>
  <meta
    name="description"
    content="Pending Circus — live dance and performance. Coming soon."
  />
  <meta name="theme-color" content="#f6f0e4" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background: var(--section-bg);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cs-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 64px;
      text-align: center;
    }

    .cs-finley {
      width: clamp(160px, 38vw, 260px);
      height: auto;
      margin-bottom: 36px;
    }

    .cs-banner {
      font-size: clamp(2.6rem, 11vw, 7rem);
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      line-height: 1;
      margin: 0 0 16px;
    }

    .cs-tagline {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 0 0 48px;
    }

    .cs-contact {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .cs-contact a {
      color: var(--ink);
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      opacity: 0.65;
      transition: opacity 0.15s;
    }

    .cs-contact a:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  <main class="cs-wrap" id="main-content">
    <img
      src="media/finley-fire.png"
      alt="Finley the fire-breathing Chihuahua"
      class="cs-finley"
      loading="eager"
      decoding="async"
    />
    <h1 class="cs-banner">Pending Circus</h1>
    <p class="cs-tagline">Coming soon.</p>
    <div class="cs-contact">
      <a href="mailto:pendingcircus@gmail.com">pendingcircus@gmail.com</a>
      <a
        href="https://instagram.com/sarah_fiadh_pending_circus"
        target="_blank"
        rel="noreferrer"
        aria-label="Instagram"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
    </div>
  </main>
</body>
</html>
